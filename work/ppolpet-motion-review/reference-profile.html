<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 · 레퍼런스 옆선 정합</title><style>body{background:#f8f6fb;color:#584667;font:14px/1.6 system-ui;margin:24px}main{max-width:1400px;margin:auto}h1{font-size:24px}canvas{width:100%;border:1px solid #ddd4e5;border-radius:12px}a{color:#755393;display:inline-block;padding:12px}pre{white-space:pre-wrap}p{color:#807088}</style><main><h1>별빛냥 · 둥근 앞얼굴과 코 위치</h1><p>첨부 이미지는 코끝 주변의 둥근 외곽선과 코 높이 기준입니다. 눈·볼은 직전 정합 후보를 유지합니다. 몸통·귀·꼬리·색상은 동일합니다.</p><p id="status">렌더링 중…</p><canvas id="board" width="1600" height="1000"></canvas><a id="save" download="starlight-reference-profile.png">비교 PNG</a><a href="alignment.html">직전 얼굴 정합</a><p>위: 레퍼런스 / 직전 후보 90° / 수정 후보 90° / 50% 오버레이<br>아래: 정면 기존·수정 / 75° 기존·수정. 같은 렌더 크기·카메라·배율을 사용합니다. 레퍼런스는 전체 캐릭터 높이와 바닥선에 맞춘 단일 배율이며, 촬영 카메라까지 같은 이미지는 아닙니다.</p><details><summary>검증 수치</summary><pre id="audit"></pre></details></main><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script src="../ppolpet/shared/pet-render.js?v=077bccec"></script><script src="../ppolpet/shared/presets.js"></script><script src="reference-profile.js"></script></html>
