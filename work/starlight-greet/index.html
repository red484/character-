<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 · 작게 손 흔들기</title><style>*{box-sizing:border-box}body{margin:24px;background:#f7f5fa;color:#51465d;font:15px system-ui}main{max-width:960px;margin:auto}h1{font-size:24px}h2{font-size:16px}p{line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e5dced;border-radius:16px;padding:16px}canvas{display:block;width:100%}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;color:inherit;background:white;border:1px solid #d6c8e0;border-radius:8px;padding:9px 12px;cursor:pointer}input[type=range]{flex:1;min-width:180px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.frames button{padding:4px}.frames span{font-size:12px;display:block;padding:6px}.frames button[aria-pressed=true]{background:#efe5fb;border-color:#9370b4}.fine{color:#796c84;font-size:13px}a{color:#7953a2}details img{width:100%}@media(max-width:600px){body{margin:12px}.card{padding:8px}}</style><main><h1>별빛냥 · 작게 손 흔들기</h1><p>2번부터 젤리가 보이도록 연결하고, 4·6번의 팔을 짧게 맞췄습니다. 같은 프레임을 좌우에서 동시에 비교합니다.</p><div class="pair"><section class="card"><h2>기존 · 젤리 전환 / 팔 길이</h2><canvas id="reference" width="512" height="576"></canvas></section><section class="card"><h2>수정 · 짧은 앞발 / 젤리 연결</h2><canvas id="stage" width="512" height="576"></canvas></section></div><div class="controls"><button id="play">일시정지</button><button id="restart">다시 인사</button><button id="last">인사 자세 보기</button><select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select><label><input id="loop" type="checkbox" checked>반복 검수</label><label><input id="ground" type="checkbox" checked>접지선</label></div><div class="controls"><input id="seek" type="range" aria-label="프레임" min="0" max="7" step="1" value="0"><output id="count"></output></div><p id="status" role="status">프레임을 불러오는 중…</p><div id="frames" class="frames"></div><p class="fine">8개 동작 프레임을 순서대로 재생합니다. 마지막 대기는 첫 프레임을 재사용해 반복 경계를 맞췄습니다. 앞발 올리기 → 작은 손짓 → 팔 내리기 순서로 반복합니다.</p><div class="controls"><button id="export">정렬된 8프레임 PNG 저장</button><a href="assets/greet-v4.png" download>원본 프레임 PNG</a><a href="../starlight-idle-sway/">승인된 갸웃갸웃</a><a href="../starlight-rest-motion/">엎드리기</a><a href="../starlight-sit/">앉기</a><a href="../starlight-walk-timing/">걷기</a></div><details><summary>원본 시트 전체</summary><img src="assets/gesture-reference.png" alt="별빛냥 동작 참고 시트"></details></main><script type="module" src="player.js?v=paw3"></script></html>
