<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 · 무언가 바라보기</title><style>*{box-sizing:border-box}body{margin:24px;background:#f7f5fa;color:#51465d;font:15px system-ui}main{max-width:960px;margin:auto}h1{font-size:24px}h2{font-size:16px}p{line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e5dced;border-radius:16px;padding:16px}canvas{display:block;width:100%}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;color:inherit;background:white;border:1px solid #d6c8e0;border-radius:8px;padding:9px 12px;cursor:pointer}input[type=range]{flex:1;min-width:180px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.frames button{padding:4px}.frames span{font-size:12px;display:block;padding:6px}.frames button[aria-pressed=true]{background:#efe5fb;border-color:#9370b4}.fine{color:#796c84;font-size:13px}a{color:#7953a2}details img{width:100%}@media(max-width:600px){body{margin:12px}.card{padding:8px}}</style><main><h1>별빛냥 · 무언가 바라보기</h1><p>짧은 두 앞발을 가슴 앞에 모으고, 위쪽에 띠롱 나타난 별을 바라봅니다. 별은 가볍게 떠 있다 사라지고, 별빛냥도 고개를 편하게 내립니다.</p><div class="pair"><section class="card"><h2>원본 시트 · 무언가 보기</h2><canvas id="reference" width="512" height="576"></canvas></section><section class="card"><h2>바라보기 · 8프레임 재생</h2><canvas id="stage" width="512" height="576"></canvas></section></div><div class="controls"><button id="play">일시정지</button><button id="restart">다시 바라보기</button><button id="last">바라보는 자세 보기</button><select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select><label><input id="loop" type="checkbox" checked>반복 검수</label><label><input id="target" type="checkbox" checked>별 모션</label><label><input id="ground" type="checkbox" checked>접지선</label></div><div class="controls"><input id="seek" type="range" aria-label="프레임" min="0" max="7" step="1" value="0"><output id="count"></output></div><p id="status" role="status">프레임을 불러오는 중…</p><div id="frames" class="frames"></div><p class="fine">8개 동작 프레임을 순서대로 재생합니다. 고개 들기 → 잠깐 바라보기 → 내려놓기로 이어집니다. 별의 등장·둥실거림도 재생 시간에 맞춰 움직입니다. 별 효과는 캐릭터 PNG와 별도로 관리합니다.</p><div class="controls"><button id="export">정렬된 8프레임 PNG 저장</button><a href="assets/look-v2.png" download>원본 프레임 PNG</a><a href="../starlight-idle-sway/">승인된 갸웃갸웃</a><a href="../starlight-rest-motion/">엎드리기</a><a href="../starlight-sit/">앉기</a><a href="../starlight-greet/">인사하기</a></div><details><summary>원본 시트 전체</summary><img src="assets/reference.png" alt="별빛냥 원본 캐릭터 시트"></details></main><script type="module" src="player.js"></script></html>
