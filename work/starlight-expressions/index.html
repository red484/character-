<style>*{box-sizing:border-box}body{margin:0;background:#f7f4fc;color:#514861;font:15px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px}h1{font-size:25px;margin:0}h2{font-size:15px;margin:0 0 8px}p{margin:8px 0 18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e4dced;border-radius:22px;padding:18px}.stage{width:100%;height:auto;display:block;max-height:390px;object-fit:contain}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select,a.button{border:1px solid #d4c6e2;background:white;border-radius:12px;padding:10px 15px;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#eae0f8;border-color:#a387bd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.choice{padding:10px;display:flex;align-items:center;flex-direction:column}.choice canvas{width:100%;max-height:220px;object-fit:contain}.choice strong{font-size:15px}.reference{width:100%;display:block}.muted{font-size:13px;color:#81758f}a{color:#786194}details{margin:20px 0}canvas{image-rendering:auto}.zoom{width:100%;max-height:180px;object-fit:contain}@media(max-width:550px){main{padding:14px}.pair{gap:8px}.card{padding:12px}.grid{gap:7px}.choice{padding:6px}button{padding:8px 12px}}</style>
<main><h1>별빛냥 · 표정 6종</h1><p>금색 링 눈을 기준으로 기본 · 행복 · 놀람 · 새침 · 윙크 · 졸림. 표정을 눌러 크게 확인해보세요.</p>
<section class="pair"><div class="card"><h2>기존 승인 · 갸웃갸웃 기본 얼굴</h2><canvas id="baseline" class="stage" width="512" height="576"></canvas></div><div class="card"><h2 id="selected">표정 · 기본</h2><canvas id="stage" class="stage" width="512" height="576"></canvas></div></section>
<div class="controls"><button id="play">일시정지</button><button id="cycle" aria-pressed="false">표정 자동 넘기기</button><label><input type="checkbox" id="sway" checked> 갸웃갸웃</label><label>속도 <select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label></div>
<p id="status" role="status">이미지 불러오는 중…</p><section class="pair"><div class="card"><h2 id="refTitle">원본 시트 · 기본</h2><canvas id="reference" class="zoom" width="400" height="300"></canvas></div><div class="card"><h2>새 표정 · 얼굴 확대</h2><canvas id="face" class="zoom" width="400" height="300"></canvas></div></section>
<div id="choices" class="grid" aria-label="표정 선택"></div><p class="muted">표정 6개를 직접 선택하거나 순서대로 전환합니다. 자동 넘기기는 표정 교체 검수이며, 눈을 감고 뜨는 중간 프레임 애니메이션은 아직 포함하지 않습니다. 갸웃갸웃은 승인된 동일한 2D 모션을 사용합니다.</p>
