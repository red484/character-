<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 · 멀뚱멀뚱 서 있기</title><style>*{box-sizing:border-box}body{margin:20px;background:#f7f5fa;color:#51465d;font:15px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}h2{font-size:16px}p{line-height:1.65}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e5dced;border-radius:16px;padding:16px}canvas{display:block;width:100%}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}button,select{font:inherit;color:inherit;padding:9px 12px;border:1px solid #d6c8e0;border-radius:8px;background:white;cursor:pointer}input[type=range]{flex:1;min-width:160px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.frames button{padding:4px}.frames span{font-size:12px;display:block;padding:6px}.frames button[aria-pressed=true]{border-color:#9875ba;background:#f0e8fa}a{color:#7953a2}.fine{font-size:13px;color:#796c84}details img{width:100%}@media(max-width:600px){body{margin:12px}.card{padding:8px}h2{font-size:14px}}</style><main><h1>별빛냥 · 멀뚱멀뚱 흔들흔들</h1><p>시트의 서기 자세를 기준으로 만든 대기 루프입니다. 링 눈 표정을 유지하며, 두 발을 짚고 상체와 팔만 작게 따라 움직입니다.</p><div class="pair"><section class="card"><h2>기준 · 원본 시트의 서기</h2><canvas id="source" width="512" height="576"></canvas></section><section class="card"><h2>대기 · 실제 반복 재생</h2><canvas id="stage" width="512" height="576"></canvas></section></div><div class="controls"><button id="play">일시정지</button><button id="restart">처음부터</button><select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select><label><input type="checkbox" id="ground" checked>발 접지선</label></div><div class="controls"><input type="range" id="seek" aria-label="프레임" min="0" max="7" value="0" step="1"><output id="count"></output></div><p id="status" role="status">이미지를 불러오는 중…</p><h2>한 주기 · 8프레임</h2><div class="frames" id="frames"></div><p class="fine">전체 이미지 프레임을 교체해 재생합니다. 얼굴을 분리해 움직이거나 머리 비율을 늘였다 줄이지 않습니다. 새로운 프레임이므로 원본과의 외형 일치도는 검수 대상입니다.</p><div class="controls"><button id="export">8프레임 PNG 저장</button><a href="assets/idle-sway-v1.png" download>원본 아틀라스</a><a href="../starlight-rest-motion/">승인된 엎드리기</a></div><p id="downloadStatus"></p><details><summary>원본 캐릭터 시트</summary><img src="assets/reference.png" alt="별빛냥 원본 캐릭터 시트"></details></main><script type="module" src="player.js?v=2"></script></html>
