<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 · 좌우로 갸웃갸웃</title><style>*{box-sizing:border-box}body{margin:20px;background:#f7f5fa;color:#51465d;font:15px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}h2{font-size:16px}p{line-height:1.65}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e5dced;border-radius:16px;padding:16px}canvas{display:block;width:100%}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}button,select{font:inherit;color:inherit;padding:9px 12px;border:1px solid #d6c8e0;border-radius:8px;background:white;cursor:pointer}input[type=range]{flex:1;min-width:160px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.frames button{padding:4px}.frames span{font-size:12px;display:block;padding:6px}.frames button[aria-pressed=true]{border-color:#9875ba;background:#f0e8fa}a{color:#7953a2}.fine{font-size:13px;color:#796c84}details img{width:100%}@media(max-width:600px){body{margin:12px}.card{padding:8px}h2{font-size:14px}}</style><main><h1>별빛냥 · 왼쪽 갸웃 · 오른쪽 갸웃</h1><p>두 발과 몸통은 안정적으로 두고, 고개를 왼쪽과 오른쪽으로 번갈아 기울입니다. 갸웃한 끝에서는 잠깐 머물렀다가 돌아옵니다.</p><div class="pair"><section class="card"><h2>이전 · 작은 상체 흔들림</h2><canvas id="source" width="512" height="576"></canvas></section><section class="card"><h2>수정 · 고개 갸웃갸웃</h2><canvas id="stage" width="512" height="576"></canvas></section></div><div class="controls"><button id="play">일시정지</button><button id="restart">처음부터</button><select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select><label><input type="checkbox" id="ground" checked>발 접지선</label></div><div class="controls"><input type="range" id="seek" aria-label="프레임" min="0" max="7" value="0" step="1"><output id="count"></output></div><p id="status" role="status">이미지를 불러오는 중…</p><h2>한 주기 · 8개 확인 지점</h2><div class="frames" id="frames"></div><p class="fine">기존 대기 모션의 얼굴을 그대로 씁니다. 머리는 비율을 유지하며 기울고, 목 아래만 부드럽게 연결됩니다. 발은 고정됩니다. 아래 8개 지점 사이도 연속적으로 움직입니다.</p><div class="controls"><button id="export">8프레임 PNG 저장</button><a href="assets/idle-sway-v1.png" download>기준 이미지</a><a href="../starlight-rest-motion/">승인된 엎드리기</a></div><p id="downloadStatus"></p><details><summary>원본 캐릭터 시트</summary><img src="assets/reference.png" alt="별빛냥 원본 캐릭터 시트"></details></main><script type="module" src="player.js?v=tilt3"></script></html>
