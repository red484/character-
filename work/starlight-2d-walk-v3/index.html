<!doctype html><meta charset="utf-8"><title>별빛냥 보행 8프레임 비교</title><style>body{font:15px system-ui;background:#f7f5fa;color:#514365;margin:20px}main{max-width:1050px;margin:auto}.row{display:flex;gap:12px}.card{background:white;padding:12px;border-radius:12px;flex:1;min-width:0}canvas{width:100%;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/20px 20px}button,select,input{padding:8px;margin:5px}#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}h1{font-size:23px}p{line-height:1.6}</style><main><h1>3/4 별빛냥 · 팔 교대 재작업 v3</h1><p>기존 / 팔 교대 후보 v3를 동일한 8프레임·속도로 반복 재생합니다. 외형 및 발 교대 검수 대기.</p><button id="play">일시정지</button><button id="reset">처음부터</button><select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select><input aria-label="프레임" id="seek" type="range" min="0" max="7" step="1" value="0"><output id="label"></output><div class="row"><section class="card"><h2>기존</h2><canvas id="old" width="400" height="400"></canvas></section><section class="card"><h2>팔 교대 후보 v3</h2><canvas id="new" width="400" height="400"></canvas></section></div><p>점선: 발 접지 기준. 아틀라스별 고정 배율을 사용하고 프레임별 투명 여백만 평행 이동하여 접지 정렬합니다. 전체 이미지를 흔들거나 회전하지 않습니다.</p><h2>수정 8프레임</h2><div id="frames"></div><p id="note">불러오는 중</p><a href="assets/after.png">수정 PNG 아틀라스</a></main><script>
const $=s=>document.querySelector(s),imgs=[new Image(),new Image()];let t=0,last=0,pause=false,k=0;const anchors=[];
function prepare(im,rows){const cw=im.width/4,ch=im.height/rows,cv=document.createElement('canvas');cv.width=Math.ceil(cw);cv.height=Math.ceil(ch);const c=cv.getContext('2d'),a=[];for(let i=0;i<8;i++){c.clearRect(0,0,cv.width,cv.height);c.drawImage(im,i%4*cw,Math.floor(i/4)*ch,cw,ch,0,0,cw,ch);const d=c.getImageData(0,0,cv.width,cv.height).data;let bottom=0;for(let y=0;y<cv.height;y++){let count=0;for(let x=0;x<cv.width;x++)if(d[(y*cv.width+x)*4+3]>200)count++;if(count>8)bottom=y;}a.push({dy:.9-bottom/ch});}return a}
function draw(ctx,im,rows,i,w,a){ctx.clearRect(0,0,w,w);const cw=im.width/4,ch=im.height/rows;const scale=rows===2?.91:1;ctx.drawImage(im,i%4*cw,Math.floor(i/4)*ch,cw,ch,(1-scale)*w/2,(.9*(1-scale)+a[i].dy*scale)*w,w*scale,w*scale);ctx.strokeStyle='#9e80bd';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,w*.9);ctx.lineTo(w,w*.9);ctx.stroke();ctx.setLineDash([])}
function tick(ts){if(!pause)t+=Math.min(80,ts-last)/1000*+$('#speed').value;last=ts;if(!pause)k=Math.floor(t*8)%8;imgs.forEach((im,j)=>draw($('#'+(j?'new':'old')).getContext('2d'),im,j?2:3,k,400,anchors[j]));$('#label').textContent=` ${k+1}/8`;$('#seek').value=k;requestAnimationFrame(tick)}
Promise.all(imgs.map((im,j)=>new Promise(r=>{im.onload=r;im.src='assets/'+(j?'after':'before')+'.png'}))).then(()=>{imgs.forEach((im,j)=>anchors[j]=prepare(im,j?2:3));for(let i=0;i<8;i++){const d=document.createElement('div'),c=document.createElement('canvas');c.width=c.height=256;draw(c.getContext('2d'),imgs[1],2,i,256,anchors[1]);d.append(c,document.createTextNode(`${i+1} · ${['가까운 발 접지','먼 발 들기','먼 발 통과','먼 발 내딛기','먼 발 접지','가까운 발 들기','가까운 발 통과','가까운 발 내딛기'][i]} (목표)`));$('#frames').append(d)}$('#note').textContent='생성 프레임 후보입니다. 목표 보행 단계와 실제 그림의 일치, 머리·얼굴 흔들림, 마지막→첫 프레임 연결을 확인합니다.';requestAnimationFrame(tick)});$('#play').onclick=()=>{pause=!pause;$('#play').textContent=pause?'재생':'일시정지'};$('#reset').onclick=()=>{t=0;k=0};$('#seek').oninput=e=>{pause=true;k=+e.target.value;$('#play').textContent='재생'};
</script>
