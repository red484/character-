<!doctype html><meta charset="utf-8"><title>별빛냥 확정 외형 · 회전과 걷기</title>
<style>body{margin:0;padding:24px;background:#f8f6fb;color:#514665;font:16px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}button,select,input{margin:5px;font:inherit}button,select{padding:9px;border:1px solid #ddd0e9;border-radius:9px;background:white;color:inherit}.row{display:flex;gap:18px}.card{flex:1;min-width:0;background:white;border-radius:18px;padding:12px}.pet{width:100%;aspect-ratio:1}h2{font-size:18px}input[type=range]{width:180px}small{display:block;margin-top:12px} @media(max-width:650px){body{padding:12px}.row{gap:8px}.card{padding:7px}h2{font-size:15px}}</style>
<main><h1>별빛냥 · 확정 외형 회전 / 걷기</h1><p>승인된 링 눈과 작은 노란 코 · 얼굴·체형 및 기존 걷기 코드 변경 없음</p>
<button id="rotate">자동 회전 정지</button><input id="angle" aria-label="회전 각도" type="range" min="0" max="360" step=".1" value="0"><output id="degrees">0°</output><br>
<button data-a="0">정면</button><button data-a="45">45°</button><button data-a="75">75°</button><button data-a="90">90°</button><button data-a="180">후면</button><button data-a="270">270°</button>
<button id="pause">걷기 일시정지</button>
<div class="row"><section class="card"><h2>서기 · 360° 회전</h2><div class="pet" id="stand"></div></section><section class="card"><h2>기존 아장아장 걷기</h2><div class="pet" id="walk"></div></section></div>
<small>두 화면은 동일한 공통 렌더러와 별빛냥 설정을 사용합니다. 걷기는 기존 보행을 재생하는 미리보기이며 이동 경로를 새로 추가하지 않았습니다.</small><p id="status">모델 불러오는 중</p><a href="model-lock.json">외형 고정 버전 기록</a>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script src="../ppolpet/shared/pet-render.js?v=approved-nose10"></script><script src="../ppolpet/shared/presets.js"></script><script>
const cfg=PpolPresets.presetConfig(PpolPresets.PRESETS[2]);const stand=PpolPet.createPet(document.querySelector('#stand'),cfg),walk=PpolPet.createPet(document.querySelector('#walk'),cfg);stand.setState('stand');walk.setState('walk');let auto=true,paused=false,yaw=0,last=0;function setAngle(v){yaw=v;stand.setAngle(v*Math.PI/180);walk.setAngle(v*Math.PI/180);document.querySelector('#angle').value=v;document.querySelector('#degrees').value=v.toFixed(1)+'°';}function autoLabel(){document.querySelector('#rotate').textContent=auto?'자동 회전 정지':'자동 회전 시작'}document.querySelector('#rotate').onclick=()=>{auto=!auto;autoLabel()};document.querySelector('#angle').oninput=e=>{auto=false;autoLabel();setAngle(+e.target.value)};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{auto=false;autoLabel();setAngle(+b.dataset.a)});document.querySelector('#pause').onclick=e=>{paused=!paused;walk.setPaused(paused);e.target.textContent=paused?'걷기 재생':'걷기 일시정지'};function frame(t){if(auto)setAngle((yaw+Math.min(t-last,100)*.012)%360);last=t;requestAnimationFrame(frame)}setAngle(0);requestAnimationFrame(frame);document.querySelector('#status').textContent='동일 모델 실시간 WebGL 재생 중 · 외형 고정';
</script></main>
