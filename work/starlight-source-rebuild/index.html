<!doctype html><meta charset="utf-8"><title>별빛냥 엎드리기 검수</title><style>body{font:15px system-ui;color:#514365;background:#f7f5fa;margin:20px}main{max-width:1000px;margin:auto}h1{font-size:24px}button,select,input{margin:5px;padding:8px}canvas{max-width:100%;background:repeating-conic-gradient(#f0edf4 0% 25%,white 0% 50%) 0/20px 20px}.stage{display:flex;justify-content:center;background:white;border-radius:16px;padding:10px}#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#frames canvas{width:100%}p{line-height:1.7}figure{margin:0}figcaption{font-size:12px}</style><main><h1>별빛냥 · 원본 시트 기준 재제작</h1><p>첨부 원본만 직접 참조한 걷기·엎드리기 신규 후보. 이전 생성본은 참조하지 않았습니다.</p><select id="motion"><option value="lie">엎드리기·휴식</option><option value="walk">걷기</option></select><button id="play">일시정지</button><button id="replay">처음부터</button><select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select><label><input id="repeat" type="checkbox" checked>반복 검수</label><label><input id="guide" type="checkbox" checked>접지선</label><br><input id="seek" aria-label="프레임" type="range" min="0" max="7" step="1" value="0"><output id="label"></output><div class="stage"><canvas id="stage" width="512" height="512"></canvas></div><p>반복 시 마지막 자세를 유지한 뒤 시작 자세로 리셋합니다. 리셋은 일어서기 동작이 아닙니다. 프레임별 확대·축소 없이 같은 배율로 재생합니다.</p><details><summary>원본 시트 비교</summary><img src="assets/reference.png" style="width:100%"></details><h2>전체 프레임</h2><div id="frames"></div><p><a href="assets/lie.png">투명 PNG 프레임 시트</a> · <a href="../starlight-2d-walk-v3/">승인된 걷기</a></p></main><script>
const $=s=>document.querySelector(s),im=new Image(),cv=$('#stage'),names=['앉은 대기','앞발 내리기','앞발 짚기','가슴 낮추기','배 접지','고개 낮추기','턱 올려놓기','엎드려 쉬기'],dur=[.4,.18,.22,.25,.25,.3,.35,1.5];let time=0,last=0,paused=false,k=0;let total=dur.reduce((a,b)=>a+b,0);function paint(c,i,w){c.clearRect(0,0,w,w);const cw=im.width/4,isLie=$('#motion').value==='lie',split=im.height*(isLie?.555:.5),row=i>=4,sy=row?split:0,ch=row?im.height-split:split,sole=im.height*(row?.956:(isLie?.527:.483))-sy,scale=w*.82/cw;c.drawImage(im,(i%4)*cw,sy,cw,ch,w*.09,w*.9-sole*scale,cw*scale,ch*scale);if($('#guide').checked){c.strokeStyle='#a88cc4';c.setLineDash([5,5]);c.beginPath();c.moveTo(0,w*.9);c.lineTo(w,w*.9);c.stroke();c.setLineDash([])}}function grid(){$('#frames').innerHTML='';for(let i=0;i<8;i++){const f=document.createElement('figure'),c=document.createElement('canvas'),l=document.createElement('figcaption');c.width=c.height=256;paint(c.getContext('2d'),i,256);l.textContent=`${i+1} · ${names[i]} (목표)`;f.append(c,l);$('#frames').append(f)}}function tick(ts){if(!paused){time+=Math.min(80,ts-last)/1000*+$('#speed').value;if(time>=total){if($('#repeat').checked)time%=total;else time=total-.001;}let n=time;k=0;while(k<7&&n>=dur[k])n-=dur[k++];}last=ts;paint(cv.getContext('2d'),k,512);$('#seek').value=k;$('#label').textContent=`${k+1}/8 · ${names[k]}`;requestAnimationFrame(tick)}$('#play').onclick=()=>{paused=!paused;$('#play').textContent=paused?'재생':'일시정지'};$('#replay').onclick=()=>{time=0;k=0;paused=false;$('#play').textContent='일시정지'};$('#seek').oninput=e=>{paused=true;k=+e.target.value;time=dur.slice(0,k).reduce((a,b)=>a+b,0);$('#play').textContent='재생'};$('#guide').onchange=grid;let started=false;im.onload=()=>{grid();if(!started){started=true;requestAnimationFrame(tick)}};$('#motion').onchange=()=>{time=0;k=0;paused=false;const walk=$('#motion').value==='walk';names.splice(0,8,...(walk?['접지1','들기1','통과1','내딛기1','접지2','들기2','통과2','내딛기2']:['앉은 대기','앞발 내리기','앞발 짚기','가슴 낮추기','배 접지','고개 낮추기','쉬기','휴식']));dur.splice(0,8,...(walk?Array(8).fill(.16):[.4,.18,.22,.25,.25,.3,.35,1.5]));total=dur.reduce((a,b)=>a+b,0);im.src='assets/'+$('#motion').value+'.png';};if(new URLSearchParams(location.search).get('motion')==='walk'){$('#motion').value='walk';$('#motion').onchange()}else im.src='assets/lie.png';
</script>
