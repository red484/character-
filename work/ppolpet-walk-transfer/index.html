<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 기준 · 여섯 친구 걷기</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4fc;color:#4c405c;font:15px system-ui}main{max-width:1050px;margin:auto;padding:22px}h1{font-size:23px;margin:0 0 9px}p{line-height:1.6}button,select,a{font:inherit;color:inherit;border:1px solid #d4c8e2;border-radius:9px;background:white;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{background:#7a5b98;color:white}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}article{background:white;border:1px solid #e1d7ec;border-radius:16px;overflow:hidden}h2{font-size:15px;margin:14px 14px 0}canvas{display:block;width:100%;height:auto}article a{display:block;border:0;text-align:center;font-size:13px;padding-top:0}#status{font-variant-numeric:tabular-nums;font-size:13px}#seek{width:100%}@media(max-width:650px){main{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:20px}h2{font-size:13px;margin:10px 10px 0}}small{color:#857590}</style><main><h1>별빛냥 걷기를 함께 적용</h1><p>같은 4가지 자세 · 같은 1.04초 주기<br><small>별빛냥은 승인 원본. 나머지 다섯 친구는 해당 자세를 옮긴 검수본입니다.</small></p><div class="controls"><button id="play">일시정지</button><button id="restart">처음부터</button><select id="speed" aria-label="재생 속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></div><div id="poses" class="controls"></div><input type="range" id="seek" aria-label="걷기 시간" min="0" max="1039" value="0"><p id="status">불러오는 중…</p><div class="grid" id="cast"></div></main><script type="module" src="review.mjs"></script></html>
