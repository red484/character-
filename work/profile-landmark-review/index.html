<!doctype html><meta charset="utf-8"><title>패치 실제 회귀 검수</title><style>body{font:16px system-ui;background:#f8f6fb;color:#514665;margin:24px}.row{display:flex;gap:20px}.row>div{flex:1;min-width:0}.pet{width:min(42vw,420px);height:min(42vw,420px);background:white}img{width:210px}pre{white-space:pre-wrap}button,input,select{margin:8px}</style>
<h1>측면 링 눈 위치 · 작은 노란 코</h1><p>형상 변경 없음. 왼쪽: 직전 수정본 / 오른쪽: 검은 눈 제거·링 눈 정합. 회전값은 0~360° 그대로 전달합니다.</p>
<button id="play">연속 회전 시작/정지</button><input id="yaw" type="range" min="0" max="360" value="0"><output id="degree">0°</output><select id="pose"><option>stand</option><option>walk</option><option>perch</option><option>sit</option><option>lie</option><option>wave</option></select>
<div class="row"><div><h2>이전</h2><div class="pet" id="old"></div></div><div><h2>수정</h2><div class="pet" id="new"></div></div></div><pre id="report">검수 중</pre><div id="shots"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script src="before.js"></script><script>window.Before=PpolPet;</script><script src="../ppolpet/shared/pet-render.js"></script><script src="../ppolpet/shared/presets.js"></script>
<script>
const cfg=PpolPresets.presetConfig(PpolPresets.PRESETS[2]), old=Before.createPet(document.querySelector('#old'),cfg), now=PpolPet.createPet(document.querySelector('#new'),cfg);old.setState('stand');now.setState('stand');old.setAngle(0);now.setAngle(0);
let playing=false,deg=0,last=0;const yaw=document.querySelector('#yaw');function angle(d){deg=d;old.setAngle(d*Math.PI/180);now.setAngle(d*Math.PI/180);yaw.value=d;document.querySelector('#degree').value=d.toFixed(1)+'°';}yaw.oninput=()=>{playing=false;angle(+yaw.value)};document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#pose').onchange=e=>{old.setState(e.target.value);now.setState(e.target.value)};function tick(t){if(playing)angle((deg+Math.min(t-last,100)*.025)%360);last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);
setTimeout(()=>{const report=[];const shot=(P,c,a,state='stand')=>P.renderSnapshot(c,{state,angle:a*Math.PI/180,staticPose:true,size:240,camera:'web'});
for(const a of [0,45,75,90,270]){const b=shot(Before,cfg,a),n=shot(PpolPet,cfg,a);report.push(a+'° actual baseline pixels identical: '+(b===n));if([0,45,75,90,270].includes(a)){const row=document.createElement('div');row.innerHTML='<h3>'+a+'° 이전 / 수정</h3><img id="before'+a+'" src="'+b+'"><img id="after'+a+'" src="'+n+'">';document.querySelector('#shots').append(row)}}
for(const i of []){const c=PpolPresets.presetConfig(PpolPresets.PRESETS[i]);report.push('Other preset '+i+' 90° identical: '+(shot(Before,c,90)===shot(PpolPet,c,90)))}
for(const state of [])report.push(state+' 0° identical: '+(shot(Before,cfg,0,state)===shot(PpolPet,cfg,0,state)));
report.push('Yaw blend -90 / 90 / 270: '+[-90,90,270].map(a=>PpolPet.profileBlendForYaw(a*Math.PI/180)).join(' / '));document.querySelector('#report').textContent=report.join('\n'); document.querySelector('#overlayRender').src=shot(PpolPet,cfg,90);},100);
</script>
<h2>첨부 측면 레퍼런스 · 50% 겹침 비교</h2><p>머리 너비와 턱 아래 기준선을 맞춘 비교입니다. 비율 왜곡 없이 동일 배율로 정렬했습니다. 전체 형상 차이는 유지됩니다.</p><div style="position:relative;width:480px;height:480px;overflow:hidden;background:white"><img src="reference.png" style="position:absolute;left:0;top:0;width:480px;height:480px;object-fit:contain"><img id="overlayRender" style="position:absolute;width:480px;left:0;top:0;opacity:.5;transform-origin:0 0;transform:translate(-15px,31px) scale(1.024)"></div><label>수정 렌더 X<input id="ox" type="range" min="-120" max="120" value="-15"></label><label>Y<input id="oy" type="range" min="-120" max="120" value="31"></label><label>크기<input id="os" type="range" min=".5" max="1.5" step=".001" value="1.024"></label><script>for(const id of ['ox','oy','os'])document.getElementById(id).oninput=()=>document.getElementById('overlayRender').style.transform=`translate(${document.getElementById('ox').value}px,${document.getElementById('oy').value}px) scale(${document.getElementById('os').value})`;</script>
