<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛냥 · 심술내기</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3fb;color:#51455f;font:15px/1.7 system-ui,sans-serif}main{max-width:1000px;padding:24px;margin:auto}h1{font-size:25px;margin:0}h2{font-size:15px;margin:0 0 10px}p{margin:8px 0 18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e2d7ed;border-radius:22px;padding:18px}.stage{width:100%;max-height:430px;object-fit:contain;display:block}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:inherit;background:white;border:1px solid #d7c7e5;border-radius:12px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#e8daf4;border-color:#a286b7}.timeline{display:flex;gap:12px;align-items:center}.timeline input{flex:1;min-width:50px}#frames{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.frame{display:flex;flex-direction:column;align-items:center;padding:8px;font-size:12px}.frame canvas{width:100%;height:auto}.muted{font-size:13px;color:#81738e}a{color:#806298}details img{width:100%}@media(max-width:550px){main{padding:14px}.pair{gap:8px}.card{padding:10px}#frames{gap:5px}.frame{padding:4px}}</style><main>
<h1>별빛냥 · 심술내기</h1><p>짧은 앞발을 가슴 앞에 포개고, 고개를 살짝 돌려 흥! 하고 다시 풀어요.</p>
<section class="pair"><div class="card"><h2>기준 · 별빛냥 새침 표정</h2><canvas id="baseline" class="stage" width="512" height="576"></canvas></div><div class="card"><h2>심술내기 · 반복 재생</h2><canvas id="stage" class="stage" width="512" height="576"></canvas></div></section>
<div class="controls"><button id="play">일시정지</button><button id="restart">처음부터</button><button id="peak">흥! 자세 보기</button><label>속도 <select id="speed"><option value=".5">0.5배</option><option selected value="1">1배</option><option value="2">2배</option></select></label><label><input type="checkbox" id="loop" checked> 반복</label><label><input type="checkbox" id="puff" checked> 작은 숨 효과</label><label><input type="checkbox" id="ground" checked> 접지선</label></div>
<div class="timeline"><input id="seek" aria-label="프레임" type="range" min="0" max="7" value="0" step="1"><output id="count">1 / 8</output></div><p id="status" role="status">불러오는 중…</p><div id="frames"></div>
<p class="muted">7개 고유 자세를 8단계로 재생합니다. 마지막은 첫 자세를 그대로 사용합니다. 앞발은 손등이 보이도록 포개져 젤리가 가려진 자세입니다. 숨 효과는 PNG와 분리되어 있습니다.</p>
<div class="controls"><button id="export">정렬된 8프레임 PNG 저장</button><a href="assets/sulk-v1.png">원본 PNG</a><a href="../starlight-expressions/">표정 6종</a><a href="../starlight-look/">바라보기</a></div><details><summary>동작 참고 · 졸린 곰 원본 시트</summary><img src="assets/gesture-reference.png" alt="졸린 곰 동작 참고 시트"></details></main><script type="module" src="player.js"></script></html>
